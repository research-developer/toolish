service:
  name: "Whisper"
  id: "whisper"
  description: "OpenAI Whisper speech recognition and translation"
  icon: "https://openai.com/favicon.ico"
  homepage: "https://openai.com/research/whisper"
  canonical_domains:
    - api.openai.com

oauth:
  authorization_url: null
  token_url: null
  scopes: []

tools:
  - id: "whisper-transcribe"
    route:
      method: POST
      path: /audio/transcriptions
      types: [json]
    semantics:
      canonical: "transcribe audio to text with Whisper"
      predicates: [transcribe, convert, recognize, speech-to-text, stt]
      objects: [audio, speech, recording, voice, conversation, interview]
      contexts: [transcription, speech recognition, audio processing, dictation]
      not: [translate, generate speech]
    params:
      file:
        type: file
        required: true
        description: "Audio file (mp3, mp4, mpeg, mpga, m4a, wav, webm)"
      model:
        type: string
        required: true
        description: "Model ID (whisper-1)"
      language:
        type: string
        required: false
        description: "Input language (ISO-639-1 code)"
      response_format:
        type: string
        required: false
        description: "Output format (json, text, srt, vtt)"

  - id: "whisper-translate"
    route:
      method: POST
      path: /audio/translations
      types: [json]
    semantics:
      canonical: "translate audio to English with Whisper"
      predicates: [translate, convert, transcribe]
      objects: [audio, speech, foreign language, recording]
      contexts: [translation, multilingual, localization]
      not: [transcribe same language]
    params:
      file:
        type: file
        required: true
        description: "Audio file to translate"
      model:
        type: string
        required: true
        description: "Model ID (whisper-1)"
      response_format:
        type: string
        required: false
        description: "Output format (json, text, srt, vtt)"
